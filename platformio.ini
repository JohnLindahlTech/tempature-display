; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[common]
; Referenced explicitly by each env below. PlatformIO does NOT merge [common]
; automatically, so flags left here without that reference are silently ignored.
build_flags = 
	-D DEBUG=1
lib_deps_builtin = 
	SPI
	Wire

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
build_flags = ${common.build_flags}
; Regenerates the build stamp (git hash + timestamp) before every build.
extra_scripts = pre:scripts/version.py
; Port is auto-detected. The Core2 shows up as /dev/cu.usbserial-* (CH9102) or
; /dev/cu.SLAB_USBtoUART (CP210x) on macOS. Override with `pio run -t upload
; --upload-port <port>` if more than one serial device is attached.
monitor_speed = 115200
; Turns a panic backtrace into file:line instead of raw addresses.
monitor_filters = esp32_exception_decoder
lib_deps =
	m5stack/M5Unified@^0.1.17
	digitaldragon/SSLClient@^1.3.2
	knolleary/PubSubClient@^2.8

; --- Over-the-air updates ----------------------------------------------------
;
; A separate env, so the serial one above stays the default: a first flash - or
; recovering a device that boot-loops - must go over USB, and that should never
; require editing this file.
;
;   pio run -t upload                      ; serial (default env)
;   pio run -e m5stack-core2-ota -t upload ; over the air
;
; The password is read from the shell, not stored here, because this file is in
; git and src/credentials.h is not. Export it once per shell:
;
;   export OTA_PASSWORD='...'              ; must match src/credentials.h
;
; mDNS is only a convenience. Across VLANs, or wherever .local does not resolve,
; put the device's IP in upload_port instead - nothing else changes:
;
;   upload_port = 10.20.30.40
;
; The transfer is bidirectional, which is the part that catches firewalls out:
;
;   host -> device   UDP  3232        the invitation (host port, size, md5)
;   device -> host   TCP  OTA_HOST_PORT   the device pulls the image back
;
; --host_port is pinned below because espota otherwise picks a random port in
; 10000-60000 on every run, which no firewall rule can follow. Pick anything
; free and allow it inbound from the device's subnet.
[env:m5stack-core2-ota]
extends = env:m5stack-core2
upload_protocol = espota
upload_port = m5-temperature-display.local
upload_flags =
	--port=3232
	--host_port=45678
	--auth=${sysenv.OTA_PASSWORD}
