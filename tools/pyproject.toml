[project]
name = "m5log"
version = "0.1.0"
description = "Attach to the temperature display's encrypted log stream"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["noiseprotocol>=0.3.1"]

[project.scripts]
m5log = "m5log.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5log"]
