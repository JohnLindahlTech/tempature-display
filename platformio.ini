; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[common]
build_flags = 
	-D DEBUG=1
lib_deps_builtin = 
	SPI
	Wire

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
build_flags = 
	${common.build_flags}
; noise-c compiles both random backends but guards each one; without this
; neither defines noise_rand_bytes and the link fails on curve25519 keygen.
	-D NOISE_USE_LIBSODIUM=1
extra_scripts = pre:scripts/version.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	m5stack/M5Unified@^0.1.17
	digitaldragon/SSLClient@^1.3.2
	knolleary/PubSubClient@^2.8
	esphome/noise-c@^0.1.11
; The Arduino framework already bundles libsodium; noise-c pulls in a second
; copy whose symbols collide at link time. Ignore the duplicate and let noise-c
; link against the one already in the SDK.
lib_ignore = libsodium

[env:m5stack-core2-ota]
extends = env:m5stack-core2
upload_protocol = espota
upload_port = m5-temperature-display.local
upload_flags = 
	--port=3232
	--host_port=45678
	--auth=${sysenv.OTA_PASSWORD}
